<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Corrected RAID and GR-1 architecture</title>
  <desc id="desc">An accurate RAID plus GR-1 architecture diagram: input RGB frame enters a frozen GR-1 encoder to produce f_t; f_t feeds a frozen GR-1 prediction head to produce f_hat t plus 1; the transition query concat f_t and f_hat t plus 1 feeds both the direct MLP trunk and retrieval module; top-k retrieved actions feed the cross-attention retrieval prior; a per-dimension gate blends the direct trunk and retrieval prior to output a 7-DOF robot action.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#4dabf7"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#51cf66"/>
    </marker>
    <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#9775fa"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #dce7f6; }
      .title { font-size: 38px; font-weight: 700; }
      .large { font-size: 30px; font-weight: 700; }
      .medium { font-size: 25px; }
      .small { font-size: 20px; }
      .tiny { font-size: 17px; }
      .step { font-size: 23px; font-weight: 700; }
      .dash { fill: none; stroke: #7d7d7d; stroke-width: 3; stroke-dasharray: 12 12; }
      .blue { fill: #10263a; stroke: #14385b; stroke-width: 3; }
      .blue-light { fill: #0d1a2a; stroke: #14385b; stroke-width: 3; }
      .green-light { fill: #10281b; stroke: #51cf66; stroke-width: 3; }
      .gold { fill: #2a1b0b; stroke: #ff922b; stroke-width: 3; }
      .purple-panel { fill: #14101f; stroke: #9775fa; stroke-width: 3; }
      .purple { fill: #211833; stroke: #9775fa; stroke-width: 3; }
      .gray { fill: #10141c; stroke: #9fb3cc; stroke-width: 3; }
      .arrow-b { fill: none; stroke: #4dabf7; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-g { fill: none; stroke: #51cf66; stroke-width: 4; marker-end: url(#arrow-green); }
      .arrow-p { fill: none; stroke: #9775fa; stroke-width: 4; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1800" height="820" fill="#080b12"/>

  <!-- Input image stacks -->
  <g transform="translate(32 112)">
    <rect x="22" y="0" width="128" height="116" rx="8" fill="#22344a" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="11" y="10" width="128" height="116" rx="8" fill="#15263a" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="0" y="20" width="128" height="116" rx="8" fill="#0d1828" stroke="#9fb3cc" stroke-width="3"/>
    <path d="M18 104 L50 58 L84 102 L104 72 L126 104 Z" fill="#4dabf7" stroke="#9fb3cc" stroke-width="3"/>
    <circle cx="106" cy="42" r="12" fill="#ff922b" stroke="#9fb3cc" stroke-width="3"/>
  </g>
  <g transform="translate(32 300)">
    <rect x="22" y="0" width="128" height="116" rx="8" fill="#22344a" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="11" y="10" width="128" height="116" rx="8" fill="#15263a" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="0" y="20" width="128" height="116" rx="8" fill="#0d1828" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="20" y="74" width="54" height="38" rx="6" fill="#2a5a86" stroke="#9fb3cc" stroke-width="3"/>
    <rect x="92" y="86" width="42" height="25" rx="5" fill="#2a5a86" stroke="#9fb3cc" stroke-width="3"/>
    <ellipse cx="84" cy="52" rx="28" ry="17" fill="#9775fa" stroke="#9fb3cc" stroke-width="3"/>
  </g>
  <text class="label medium" x="40" y="508">Input RGB</text>
  <text class="label medium" x="40" y="540">frame s<tspan baseline-shift="sub" font-size="17">t</tspan></text>

  <!-- Architecture boundary -->
  <rect class="dash" x="226" y="44" width="1398" height="690" rx="28"/>
  <text class="label title" x="260" y="102">RAID + GR-1</text>

  <!-- Step 1: encoder -->
  <circle cx="276" cy="158" r="22" fill="#080b12" stroke="#dce7f6" stroke-width="2"/>
  <text class="label step" x="269" y="166">1</text>
  <rect class="blue" x="310" y="190" width="176" height="142" rx="12"/>
  <text class="label medium" x="358" y="238">Frozen</text>
  <text class="label medium" x="372" y="274">GR-1</text>
  <text class="label medium" x="348" y="310">Encoder</text>

  <!-- Step 2: GR-1 prediction -->
  <circle cx="528" cy="158" r="22" fill="#080b12" stroke="#dce7f6" stroke-width="2"/>
  <text class="label step" x="521" y="166">2</text>
  <rect class="blue-light" x="540" y="218" width="120" height="86" rx="12"/>
  <text class="label medium" x="590" y="253">f<tspan baseline-shift="sub" font-size="17">t</tspan></text>
  <text class="label small" x="568" y="281">(384d)</text>

  <rect class="blue" x="328" y="442" width="184" height="134" rx="12"/>
  <text class="label medium" x="368" y="486">GR-1</text>
  <text class="label medium" x="352" y="522">Prediction</text>
  <text class="label medium" x="390" y="558">Head</text>

  <rect class="blue-light" x="540" y="466" width="136" height="88" rx="12"/>
  <text class="label medium" x="584" y="502">f&#770;<tspan baseline-shift="sub" font-size="17">t+1</tspan></text>
  <text class="label small" x="578" y="531">(384d)</text>

  <path class="arrow-b" d="M164 360 C202 360 222 262 302 262"/>
  <path class="arrow-b" d="M486 262 H532"/>
  <path class="arrow-b" d="M600 304 C600 374 524 382 474 440"/>
  <path class="arrow-b" d="M512 510 H532"/>

  <!-- Explicit transition-pair node -->
  <rect class="green-light" x="730" y="336" width="250" height="128" rx="14"/>
  <text class="label medium" x="782" y="382">Transition query</text>
  <text class="label small" x="760" y="420">concat(f<tspan baseline-shift="sub" font-size="15">t</tspan>, f&#770;<tspan baseline-shift="sub" font-size="15">t+1</tspan>)</text>
  <text class="label tiny" x="766" y="448">used by direct trunk and retrieval</text>

  <path class="arrow-g" d="M660 262 C710 262 700 372 724 386"/>
  <path class="arrow-g" d="M676 510 C710 510 700 428 724 414"/>

  <!-- Memory bank -->
  <rect class="gold" x="730" y="540" width="330" height="148" rx="14"/>
  <text class="label medium" x="784" y="582">RAID Memory Bank</text>
  <text class="label small" x="770" y="620">{concat(f<tspan baseline-shift="sub" font-size="15">i</tspan>, f<tspan baseline-shift="sub" font-size="15">i+1</tspan>), a<tspan baseline-shift="sub" font-size="15">i</tspan>}</text>
  <text class="label tiny" x="850" y="646">i = 1...N</text>
  <text class="label tiny" x="776" y="674">cosine similarity; top-k retrieval, k = 3</text>

  <path class="arrow-g" d="M854 464 V532"/>

  <!-- Decoder panel -->
  <rect class="purple-panel" x="1106" y="82" width="474" height="560" rx="16"/>
  <circle cx="1140" cy="118" r="22" fill="#080b12" stroke="#dce7f6" stroke-width="2"/>
  <text class="label step" x="1133" y="126">3</text>
  <text class="label large" x="1260" y="128">RAID Decoder</text>
  <text class="label small" x="1168" y="168">Combines direct MLP trunk, cross-attention</text>
  <text class="label small" x="1168" y="196">retrieval prior, and per-dimension gate</text>

  <rect class="purple" x="1154" y="252" width="230" height="108" rx="12"/>
  <text class="label medium" x="1210" y="294">Direct MLP</text>
  <text class="label medium" x="1230" y="326">Trunk</text>
  <text class="label tiny" x="1196" y="346">(f<tspan baseline-shift="sub" font-size="13">t</tspan>, f&#770;<tspan baseline-shift="sub" font-size="13">t+1</tspan>)</text>

  <rect class="purple" x="1142" y="456" width="296" height="116" rx="12"/>
  <text class="label medium" x="1184" y="498">Cross-Attention</text>
  <text class="label medium" x="1196" y="530">Retrieval Prior</text>
  <text class="label tiny" x="1174" y="556">(query transition, top-k actions)</text>

  <rect class="purple" x="1454" y="362" width="104" height="120" rx="12"/>
  <text class="label medium" x="1470" y="402">Per-</text>
  <text class="label medium" x="1464" y="434">dim</text>
  <text class="label medium" x="1474" y="466">Gate</text>

  <!-- Decoder inputs -->
  <path class="arrow-p" d="M980 384 C1040 384 1052 306 1146 306"/>
  <path class="arrow-p" d="M980 416 C1040 416 1046 512 1134 512"/>
  <path class="arrow-g" d="M1060 614 C1110 614 1088 540 1134 538"/>
  <text class="label tiny" x="1046" y="604" fill="#51cf66">top-k actions</text>

  <!-- Gate blending and output -->
  <path class="arrow-p" d="M1384 306 H1506 V354"/>
  <path class="arrow-p" d="M1438 514 C1500 514 1506 494 1506 490"/>
  <path class="arrow-p" d="M1558 422 H1604"/>
  <rect class="gray" x="1614" y="340" width="156" height="164" rx="14"/>
  <text class="label medium" x="1637" y="382">{dx, dy,</text>
  <text class="label medium" x="1637" y="414">dz, droll,</text>
  <text class="label medium" x="1637" y="446">dpitch,</text>
  <text class="label medium" x="1637" y="478">dyaw, grip}</text>

</svg>
